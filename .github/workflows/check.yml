name: Foundation checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install pinned tools
        run: |
          npm install --global pnpm@10.32.1
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup target add --toolchain 1.95.0 aarch64-unknown-linux-gnu
          cargo +1.95.0 install --locked --root .tools cargo-deny --version 0.20.2
          cargo +1.95.0 install --locked --root .tools cargo-machete --version 0.9.2
      - name: Install shell tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes shellcheck shfmt libasound2-dev pkg-config liblilv-dev lv2-dev swh-lv2
      - name: Install shell tools (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install shellcheck shfmt
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: pnpm --dir apps/web exec playwright install --with-deps chromium webkit
      - run: pnpm check
      - name: Linux LV2 qualification
        if: runner.os == 'Linux'
        run: pnpm lv2:check
      - name: ARM Linux compile check (no hardware/audio claim)
        run: cargo +1.95.0 check --locked --manifest-path Cargo.toml --workspace --target aarch64-unknown-linux-gnu
      - name: Commit titles
        if: github.event_name == 'pull_request'
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/commits.mjs range "$COMMIT_BASE..$COMMIT_HEAD"
      - name: Release configuration/version check
        run: pnpm release:dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-${{ matrix.os }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
