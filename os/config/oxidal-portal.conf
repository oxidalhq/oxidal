# Pi recovery-hotspot discovery only; included in nginx's http context.
geo $oxidal_portal_client {
    default 0;
    10.42.0.0/24 1;
}
map $server_addr $oxidal_portal_address {
    default 0;
    10.42.0.1 1;
}
server {
    listen 80;
    server_name oxidal.local 10.42.0.1 captive.apple.com connectivitycheck.gstatic.com connectivitycheck.android.com clients3.google.com;
    if ($oxidal_portal_client = 0) { return 404; }
    if ($oxidal_portal_address = 0) { return 404; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location = /welcome {
        default_type text/html;
        alias /usr/share/oxidal/portal/index.html;
    }
    location = /wordmark.svg {
        default_type image/svg+xml;
        alias /opt/oxidal/ui/brand/wordmark.svg;
    }
    # Fixed destination: never reflect probe hosts, paths or query strings.
    # HTTP does not proxy the app, accept credentials or execute commands.
    location / { return 302 http://10.42.0.1/welcome; }
}
