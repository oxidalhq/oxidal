# Included from nginx's http context. TLS and authentication protect all assets and API routes.
map $http_origin $oxidal_origin_ok {
    default 0;
    "" 1;
    "https://oxidal.local" 1;
    "https://10.42.0.1" 1;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name oxidal.local 10.42.0.1;
    if ($host !~ ^(oxidal\.local|10\.42\.0\.1)$) { return 403; }
    if ($oxidal_origin_ok = 0) { return 403; }
    ssl_certificate /etc/oxidal/tls/server.crt;
    ssl_certificate_key /etc/oxidal/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Oxidal device";
    auth_basic_user_file /etc/oxidal/access.htpasswd;
    client_max_body_size 128m;
    # Avoid recording preset identifiers, credentials or query strings.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host 127.0.0.1:3210;
        # Only rewrite Origin after the external origin and host checks above.
        proxy_set_header Origin http://127.0.0.1:3210;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
