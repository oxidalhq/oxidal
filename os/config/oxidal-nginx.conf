# Included from nginx's http context. TLS and authentication protect all assets and API routes.
map $http_origin $oxidal_origin_ok {
    default 0;
    "" 1;
    "https://oxidal.local" 1;
    "https://10.42.0.1" 1;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name oxidal.local 10.42.0.1;
    # Oxidal current IPv4 address: exact local socket, never forwarded headers.
    set $oxidal_host_ok 0;
    if ($host ~ ^(oxidal\.local|10\.42\.0\.1)$) { set $oxidal_host_ok 1; }
    if ($host = $server_addr) { set $oxidal_host_ok 1; }
    if ($oxidal_host_ok = 0) { return 403; }
    set $oxidal_request_origin_ok $oxidal_origin_ok;
    if ($http_origin = "https://$server_addr") { set $oxidal_request_origin_ok 1; }
    if ($oxidal_request_origin_ok = 0) { return 403; }
    ssl_certificate /etc/oxidal/tls/server.crt;
    ssl_certificate_key /etc/oxidal/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Oxidal device";
    auth_basic_user_file /etc/oxidal/access.htpasswd;
    client_max_body_size 128m;
    # Avoid recording preset identifiers, credentials or query strings.
    access_log off;
    # Oxidal public certificate: exact public files, still authenticated.
    location = /api/v1/device/certificate {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        default_type application/x-x509-ca-cert;
        add_header Cache-Control "no-store" always;
        alias /usr/share/oxidal/public/ca.crt;
    }
    location = /api/v1/device/certificate.json {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        default_type application/json;
        add_header Cache-Control "no-store" always;
        alias /usr/share/oxidal/public/certificate.json;
    }
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host 127.0.0.1:3210;
        # Only rewrite Origin after the external origin and host checks above.
        proxy_set_header Origin http://127.0.0.1:3210;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
