[package]
name = "oxidal-tone3000"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
native = []
audio-worker = ["native", "oxidal-audio/alsa"]
audio-qualification = ["audio-worker", "oxidal-audio/qualification"]

[dependencies]
oxidal-audio = { path = "../oxidal-audio", version = "0.1.0" }
serde_json.workspace = true
serde.workspace = true
schemars.workspace = true
oxidal-presets = { path = "../oxidal-presets", version = "0.1.0" }

[dev-dependencies]
sha2 = "0.10"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"

[[example]]
name = "qualify"
required-features = ["native"]

[[bin]]
name = "oxidal-native-worker"
required-features = ["native"]

[[bin]]
name = "oxidal-audio-worker"
required-features = ["audio-worker"]
