[package]
name = "oxidal-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
alsa = ["dep:alsa", "dep:libc"]
# Explicit software fixture access for native integration tests, excluded from normal builds.
qualification = ["alsa"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.12.1", optional = true }
libc = { version = "0.2.191", optional = true }

# Workspace lints, except unsafe code is denied rather than forbidden so the
# realtime module alone can make its two scheduling syscalls.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
