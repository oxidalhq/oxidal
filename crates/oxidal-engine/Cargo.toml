[package]
name = "oxidal-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
native = ["oxidal-tone3000/native", "oxidal-lv2/native"]
worker = ["native", "oxidal-audio/alsa"]
qualification = ["worker", "oxidal-audio/qualification", "oxidal-lv2/qualification"]

[dependencies]
serde.workspace = true
schemars.workspace = true
oxidal-audio = { path = "../oxidal-audio", version = "0.1.0" }
oxidal-graph.workspace = true
oxidal-presets = { path = "../oxidal-presets", version = "0.1.0" }
serde_json.workspace = true
sha2 = "0.10"
oxidal-tone3000 = { path = "../oxidal-tone3000", version = "0.1.0" }
oxidal-lv2 = { path = "../oxidal-lv2", version = "0.1.0" }

[lints]
workspace = true

[[example]]
name = "qualify_mixed"
required-features = ["native"]

[[bin]]
name = "oxidal-rig-worker"
path = "src/bin/oxidal-rig-worker.rs"
required-features = ["worker"]
